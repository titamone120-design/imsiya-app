name: Build IMSIYA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "supabase.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: android-release-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          echo "Using Android SDK at $ANDROID_HOME"

      - name: Install locked dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK with embedded JavaScript bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify JavaScript bundle is packaged in APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/index\.android\.bundle\.hbc'
          echo "Standalone JavaScript bundle is present."

      - name: Upload standalone installable APK
        uses: actions/upload-artifact@v4
        with:
          name: IMSIYA-Android-Standalone-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
