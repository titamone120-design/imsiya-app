name: Build IMSIYA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build APK with Expo EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download generated APK
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) {
            console.error('EAS did not return an APK download URL. Build response:', JSON.stringify(result, null, 2));
            process.exit(1);
          }
          (async () => {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`APK download failed: HTTP ${response.status}`);
            fs.writeFileSync('IMSIYA.apk', Buffer.from(await response.arrayBuffer()));
            console.log('Downloaded IMSIYA.apk');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: IMSIYA-Android-APK
          path: IMSIYA.apk
          if-no-files-found: error
          retention-days: 14
