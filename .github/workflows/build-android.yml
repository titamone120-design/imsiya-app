name: Build IMSIYA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "supabase.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          echo "Using Android SDK at $ANDROID_HOME"

      - name: Install locked dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: IMSIYA-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
