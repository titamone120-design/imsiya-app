name: Deploy IMSIYA Web Preview

on:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase.ts'
      - 'assets/**'
      - '.github/workflows/deploy-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: imsiya-web-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and sync lockfile if needed
        run: npm install
      - name: Export IMSIYA for web
        run: npx expo export --platform web --output-dir dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
