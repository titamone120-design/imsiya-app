name: Validate IMSIYA web build
on:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase.ts'
      - 'assets/**'
      - '.github/workflows/deploy-web-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imsiya-web-validation
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify IMSIYA web export
        run: npx expo export --platform web --output-dir dist
